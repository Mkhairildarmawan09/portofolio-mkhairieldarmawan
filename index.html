    <style id="fix-portofolio-exact">
      /* 1. OPTIMASI PERFORMA */
      .liquid-metal-border,
      [data-paper-shader] {
        pointer-events: none !important;
        opacity: 0.25;
      }

      .portfolioproject-card,
      .portfoliocert-card,
      .portfolioachievement-card,
      .portfolioskill-card,
      .portfoliotech-card {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .meteor:nth-child(n+7) {
        display: none !important;
      }

      /* 2. SECTION & TAB NAVIGASI */
      .portfolioroot-section {
        position: relative;
        max-width: 1200px;
        margin: 0 auto;
        padding: 5rem 1.5rem 7rem;
        z-index: 2;
      }

      .portfoliocontainer-inner {
        width: 100%;
      }

      .portfoliotab-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem;
        margin: 1.5rem auto 3rem;
        padding: 0.5rem;
        width: fit-content;
        max-width: 100%;
        background: rgba(13, 18, 36, 0.92);
        border: 1px solid rgba(139, 92, 246, 0.28);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      .portfoliotab-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.7rem 1.35rem;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #94a3b8;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .portfoliotab-btn svg {
        width: 18px;
        height: 18px;
      }

      .portfoliotab-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.06);
      }

      .portfoliotab-btn.is-active {
        color: #ffffff;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.38), rgba(139, 92, 246, 0.38));
        border-color: rgba(129, 140, 248, 0.6);
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.32);
      }

      /* 3. GRID & KARTU PROJECTS */
      .portfoliocards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 2rem;
        align-items: stretch;
      }

      .portfolioproject-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #111830 0%, #0a0e1c 100%);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 20px;
        overflow: hidden;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .portfolioproject-card:hover {
        transform: translateY(-6px);
        border-color: rgba(96, 165, 250, 0.55);
        box-shadow: 0 16px 36px -12px rgba(59, 130, 246, 0.28);
      }

      .portfolioproject-card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .portfoliocard-thumbnail {
        position: relative;
        width: 100%;
        height: 210px;
        overflow: hidden;
        background: #0b1120;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      .portfoliocard-thumbnail-image,
      .portfoliocard-thumbnail img {
        width: 100% !important;
        height: 210px !important;
        object-fit: cover;
        object-position: top center;
        display: block;
      }

      .portfoliocard-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 1.5rem;
      }

      .portfoliocard-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #f8fafc;
        margin: 0 0 0.65rem;
      }

      .portfoliocard-desc {
        font-size: 0.92rem;
        line-height: 1.65;
        color: #94a3b8;
        margin: 0 0 1.4rem;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .portfoliocard-footer,
      .portfoliocard-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
      }

      .portfoliodetails-btn,
      .portfoliocard-body button {
        position: relative;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.6rem 1.15rem;
        border-radius: 10px;
        border: 1px solid rgba(96, 165, 250, 0.4);
        background: rgba(59, 130, 246, 0.16);
        color: #93c5fd;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .portfoliodetails-btn:hover,
      .portfoliocard-body button:hover {
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        border-color: transparent;
        color: #ffffff;
      }

      .portfoliocard-body a {
        position: relative;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #60a5fa;
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
      }

      .portfoliocard-body a:hover {
        color: #bfdbfe;
        text-decoration: underline;
      }

      /* 4. CERTIFICATES & ACHIEVEMENTS (PAKSA SUSUNAN ATAS-BAWAH) */
      .portfoliocertificates-grid,
      .portfolioachievements-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 1.75rem;
      }

      .portfoliocert-card,
      .portfolioachievement-card {
        position: relative;
        display: flex !important;
        flex-direction: column !important;
        background: linear-gradient(180deg, #111830 0%, #0a0e1c 100%) !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
        border-radius: 18px !important;
        padding: 0 !important;
        overflow: hidden !important;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        cursor: pointer;
      }

      /* Paksa semua div pembungkus di dalam kartu sertifikat tersusun vertikal (bukan ke samping) */
      .portfoliocert-card > div:not(.liquid-metal-border),
      .portfolioachievement-card > div:not(.liquid-metal-border) {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        gap: 0 !important;
      }

      .portfoliocert-card:hover,
      .portfolioachievement-card:hover {
        transform: translateY(-5px);
        border-color: rgba(139, 92, 246, 0.55) !important;
        box-shadow: 0 14px 30px -10px rgba(99, 102, 241, 0.3);
      }

      .portfoliocert-preview-image,
      .portfoliocert-card img,
      .portfolioachievement-card img {
        width: 100% !important;
        max-width: 100% !important;
        height: 210px !important;
        object-fit: cover !important;
        object-position: top center !important;
        border-radius: 0 !important;
        margin: 0 !important;
        display: block !important;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      /* Tombol "Lihat sertifikat" di bagian bawah kartu */
      .portfoliocert-card button,
      .portfoliocert-card a,
      .portfoliocert-card span,
      .portfolioachievement-card button,
      .portfolioachievement-card a,
      .portfolioachievement-card span {
        position: relative;
        z-index: 5 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0.5rem !important;
        width: calc(100% - 2rem) !important;
        margin: 0.9rem 1rem !important;
        padding: 0.65rem 1rem !important;
        border-radius: 12px !important;
        border: 1px solid rgba(96, 165, 250, 0.35) !important;
        background: rgba(59, 130, 246, 0.14) !important;
        color: #93c5fd !important;
        font-family: 'Space Grotesk', 'Inter', sans-serif !important;
        font-size: 0.9rem !important;
        font-weight: 600 !important;
        white-space: nowrap !important;
        text-decoration: none !important;
        box-sizing: border-box !important;
        transition: all 0.2s ease;
      }

      .portfoliocert-card:hover button,
      .portfoliocert-card:hover a,
      .portfoliocert-card:hover span,
      .portfolioachievement-card:hover button,
      .portfolioachievement-card:hover a,
      .portfolioachievement-card:hover span {
        background: linear-gradient(135deg, #3b82f6, #6366f1) !important;
        border-color: transparent !important;
        color: #ffffff !important;
      }

      .portfoliocert-card svg,
      .portfolioachievement-card svg {
        width: 16px !important;
        height: 16px !important;
        flex-shrink: 0 !important;
      }

      /* 5. TECH STACK */
      .portfolioskills-grid,
      .portfoliotech-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 1.25rem;
      }

      .portfolioskill-card,
      .portfoliotech-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem 1rem;
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 16px;
        text-align: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .portfolioskill-card:hover,
      .portfoliotech-card:hover {
        transform: translateY(-4px);
        border-color: rgba(96, 165, 250, 0.5);
        background: #1e293b;
      }

      .portfolioskill-card img,
      .portfoliotech-card img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      /* 6. MODAL SERTIFIKAT & PROJECT (MENANGANI NAMA CLASS TANPA TANDA HUBUNG) */
      .portfoliomodal-backdrop,
      .portfoliocert-modal-backdrop,
      .portfolioproject-modal-backdrop,
      [class*="portfoliomodal"] {
        position: fixed !important;
        inset: 0 !important;
        background: rgba(3, 7, 18, 0.88) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 1.25rem !important;
        z-index: 99999 !important;
      }

      .portfoliomodal-dialog,
      .portfoliocert-modal-dialog,
      .portfolioproject-modal-dialog {
        position: relative !important;
        width: 100% !important;
        max-width: 860px !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
        background: linear-gradient(180deg, #0f172a 0%, #090d1a 100%) !important;
        border: 1px solid rgba(99, 102, 241, 0.45) !important;
        border-radius: 22px !important;
        padding: 1.75rem !important;
        color: #f8fafc !important;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85) !important;
      }

      .portfoliomodal-dialog img,
      .portfoliocert-modal-dialog img,
      .portfolioproject-modal-dialog img {
        width: 100% !important;
        max-height: 70vh !important;
        object-fit: contain !important;
        background: #050814 !important;
        border-radius: 14px !important;
        margin-bottom: 1.25rem !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- JAGA AGAR SCROLL TIDAK TERKUNCI & MODAL SERTIFIKAT BISA DITUTUP -->
    <script>
      (function () {
        function syncModalAndScroll() {
          var hasVisibleModal = false;
          document.querySelectorAll('[class*="modal"]').forEach(function (el) {
            if (el.offsetParent !== null || getComputedStyle(el).position === 'fixed') {
              hasVisibleModal = true;
            }
          });
          // Jika tidak ada modal yang tampil di layar, pastikan body selalu bisa di-scroll
          if (!hasVisibleModal && document.body.style.overflow === 'hidden') {
            document.body.style.overflow = '';
          }
        }

        setInterval(syncModalAndScroll, 300);
      })();
    </script>
  </body>
</html>
