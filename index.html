<html lang="id">
  <head>
    <meta charset="UTF-8" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"

    <title>M. Khairiel Darmawan | Portofolio</title>

    <link rel="stylesheet" crossorigin href="./assets/index-BAu5BQY0.css">

    <style id="fix-portofolio-exact">
      /* Section & Container */
      .portfolioroot-section {
        position: relative;
        max-width: 1200px;
        margin: 0 auto;
        padding: 5rem 1.5rem 7rem;
        z-index: 2;
      }

      .portfoliocontainer-inner {
        width: 100%;
      }

      /* Tab Navigasi (Projects, Certificates, Achievements, Tech Stack) */
      .portfoliotab-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem;
        margin: 1.5rem auto 3rem;
        padding: 0.5rem;
        width: fit-content;
        max-width: 100%;
        background: rgba(13, 18, 36, 0.78);
        border: 1px solid rgba(139, 92, 246, 0.28);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      .portfoliotab-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.7rem 1.35rem;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #94a3b8;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .portfoliotab-btn svg {
        width: 18px;
        height: 18px;
      }

      .portfoliotab-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.06);
      }

      .portfoliotab-btn.is-active {
        color: #ffffff;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.38), rgba(139, 92, 246, 0.38));
        border-color: rgba(129, 140, 248, 0.6);
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.32);
      }

      /* Grid Kartu Proyek */
      .portfoliocards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 2rem;
        align-items: stretch;
      }

      /* Kartu Proyek */
      .portfolioproject-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(17, 24, 48, 0.88) 0%, rgba(10, 14, 28, 0.95) 100%);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 20px;
        overflow: hidden;
        backdrop-filter: blur(12px);
        transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .portfolioproject-card:hover {
        transform: translateY(-7px);
        border-color: rgba(96, 165, 250, 0.55);
        box-shadow: 0 18px 40px -12px rgba(59, 130, 246, 0.3);
      }

      .portfolioproject-metal-border {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 20px;
        overflow: hidden;
        opacity: 0.45;
      }

      .portfolioproject-metal-border canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      .portfolioproject-card-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      /* Thumbnail Gambar Proyek (Mengunci ukuran agar tidak meluber) */
      .portfoliocard-thumbnail {
        position: relative;
        width: 100%;
        height: 210px;
        overflow: hidden;
        background: #0b1120;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      .portfoliocard-thumbnail-image,
      .portfoliocard-thumbnail img {
        width: 100% !important;
        height: 210px !important;
        object-fit: cover;
        object-position: top center;
        display: block;
        transition: transform 0.45s ease;
      }

      .portfolioproject-card:hover .portfoliocard-thumbnail-image {
        transform: scale(1.05);
      }

      /* Konten Teks Kartu */
      .portfoliocard-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 1.5rem;
      }

      .portfoliocard-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #f8fafc;
        margin: 0 0 0.65rem;
      }

      .portfoliocard-desc {
        font-size: 0.92rem;
        line-height: 1.65;
        color: #94a3b8;
        margin: 0 0 1.4rem;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Tombol & Link Footer Kartu */
      .portfoliocard-footer,
      .portfoliocard-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
      }

      .portfoliodetails-btn,
      .portfoliocard-body button {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.6rem 1.15rem;
        border-radius: 10px;
        border: 1px solid rgba(96, 165, 250, 0.4);
        background: rgba(59, 130, 246, 0.16);
        color: #93c5fd;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.22s ease;
      }

      .portfoliodetails-btn:hover,
      .portfoliocard-body button:hover {
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        border-color: transparent;
        color: #ffffff;
      }

      .portfoliocard-body a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #60a5fa;
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
      }

      .portfoliocard-body a:hover {
        color: #bfdbfe;
        text-decoration: underline;
      }

      /* Tab Certificates, Achievements & Tech Stack */
      .portfoliocertificates-grid,
      .portfolioachievements-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .portfoliocert-card,
      .portfolioachievement-card {
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.25s ease, border-color 0.25s ease;
        cursor: pointer;
      }

      .portfoliocert-card:hover,
      .portfolioachievement-card:hover {
        transform: translateY(-5px);
        border-color: rgba(139, 92, 246, 0.5);
      }

      .portfoliocert-preview-image,
      .portfoliocert-card img,
      .portfolioachievement-card img {
        width: 100%;
        height: 195px;
        object-fit: cover;
        display: block;
      }

      .portfolioskills-grid,
      .portfoliotech-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 1.25rem;
      }

      .portfolioskill-card,
      .portfoliotech-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem 1rem;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 16px;
        text-align: center;
        transition: all 0.25s ease;
      }

      .portfolioskill-card:hover,
      .portfoliotech-card:hover {
        transform: translateY(-4px);
        border-color: rgba(96, 165, 250, 0.5);
        background: rgba(30, 41, 59, 0.88);
      }

      .portfolioskill-card img,
      .portfoliotech-card img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      /* Popup Modal Detail Project */
      .portfoliomodal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(3, 7, 18, 0.82);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        z-index: 9999;
      }

      .portfoliomodal-dialog {
        width: 100%;
        max-width: 820px;
        max-height: 90vh;
        overflow-y: auto;
        background: linear-gradient(180deg, #0f172a 0%, #090d1a 100%);
        border: 1px solid rgba(99, 102, 241, 0.35);
        border-radius: 24px;
        padding: 2rem;
        color: #f8fafc;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        position: relative;
      }

      .portfoliomodal-dialog img {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        object-position: top center;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
