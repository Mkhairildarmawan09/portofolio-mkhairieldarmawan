      /* 6. TECH STACK */

  <body>
    <div id="root"></div>

    <script>
      (function () {
        // ============================================================
        // UBAH JUDUL PIAGAM DI SINI SESUAI NAMA PENCAPAIAN ASLI KAMU
        // ============================================================
        var JUDUL_PIAGAM = [
          'Preview Piagam 1',
          'Preview Piagam 2',
        ];

        // 1. GANTI NAMA BRAND NAVBAR MOBILE MENJADI AriiDev.
        function updateBrandAndTech() {
          document.querySelectorAll('.navbar-mobile-brand').forEach(function (el) {
            if (el.textContent.trim() !== 'AriiDev.') {
              el.textContent = 'AriiDev.';
              el.setAttribute('aria-label', 'AriiDev.');
            }
          });

          // 2. TAMBAH FIGMA & CANVA DI TECH STACK
          var grid = document.querySelector('.portfolioskills-grid, .portfoliotech-grid');
          if (!grid) {
            var cards = document.querySelectorAll('[class*="skill-card"], [class*="tech-card"]');
            if (cards.length > 0) grid = cards[0].parentElement;
          }
          if (grid && grid.dataset.extraToolsAdded !== 'true' && grid.firstElementChild) {
            var extraTools = [
              {
                name: 'Figma',
                svg:
                  '<svg viewBox="0 0 38 57" width="44" height="44" style="display:block;background:transparent" xmlns="http://www.w3.org/2000/svg">' +
                  '<path fill="#1ABCFE" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z"/>' +
                  '<path fill="#0ACF83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z"/>' +
                  '<path fill="#FF7262" d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z"/>' +
                  '<path fill="#F24E1E" d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z"/>' +
                  '<path fill="#A259FF" d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z"/>' +
                  '</svg>'
              },
              {
                name: 'Canva',
                svg:
                  '<svg viewBox="0 0 64 64" width="46" height="46" style="display:block;background:transparent" xmlns="http://www.w3.org/2000/svg">' +
                  '<defs><linearGradient id="canvaGrad" x1="10%" y1="90%" x2="90%" y2="10%">' +
                  '<stop offset="0%" stop-color="#00C4CC"/><stop offset="50%" stop-color="#3B66F5"/><stop offset="100%" stop-color="#7D2AE8"/>' +
                  '</linearGradient></defs>' +
                  '<circle cx="32" cy="32" r="30" fill="url(#canvaGrad)"/>' +
                  '<path fill="#FFFFFF" d="M39.6 38.2c-.8 0-1.4.5-2.1 1.4-1.7 2.2-3.9 3.6-6.4 3.6-3.4 0-5.6-2.5-5.6-6.5 0-5.8 4.2-11.8 9.2-11.8 2.1 0 3.4 1.1 3.4 2.7 0 1.4-.9 2.5-2.1 2.5-.9 0-1.5-.5-1.5-1.2 0-.4.2-.8.4-1.1-.3-.2-.7-.3-1.2-.3-2.9 0-5.2 4.3-5.2 8.7 0 2.6 1.3 4.2 3.5 4.2 2.1 0 4.1-1.3 5.7-3.4.5-.7 1.1-1 1.7-1 .9 0 1.6.7 1.6 1.5 0 .4-.2.8-.6 1.2-.3.2-.5.5-.8.5z"/>' +
                  '</svg>'
              }
            ];

            var templateCard = grid.firstElementChild;
            extraTools.forEach(function (tool) {
              if (grid.textContent.indexOf(tool.name) !== -1) return;
              var newCard = templateCard.cloneNode(true);
              var oldMedia = newCard.querySelector('img, svg');
              if (oldMedia) {
                var wrapper = oldMedia.parentElement;
                if (wrapper && wrapper !== newCard) {
                  wrapper.style.background = 'transparent';
                  wrapper.style.boxShadow = 'none';
                  wrapper.style.border = 'none';
                }
                var svgHolder = document.createElement('div');
                svgHolder.style.cssText = 'display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:transparent;';
                svgHolder.innerHTML = tool.svg;
                oldMedia.replaceWith(svgHolder);
              }
              var labelUpdated = false;
              newCard.querySelectorAll('span, p, h3, h4, div').forEach(function (el) {
                if (!labelUpdated && el.children.length === 0 && el.textContent.trim().length > 0) {
                  el.textContent = tool.name;
                  labelUpdated = true;
                }
              });
              grid.appendChild(newCard);
            });
            grid.dataset.extraToolsAdded = 'true';
          }
        }

        new MutationObserver(updateBrandAndTech).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
        updateBrandAndTech();

        // 3. JAGA SCROLL HALAMAN TIDAK PERNAH TERKUNCI
        setInterval(function () {
          if (!document.getElementById('custom-cert-viewer')) {
            if (document.body.style.overflow === 'hidden') document.body.style.overflow = '';
            if (document.documentElement.style.overflow === 'hidden') document.documentElement.style.overflow = '';
          }
        }, 250);

        // 4. PREVIEW MODAL SERTIFIKAT & PIAGAM
        function openCertViewer(imgSrc, titleText) {
          var existing = document.getElementById('custom-cert-viewer');
          if (existing) existing.remove();

          document.querySelectorAll('[class*="modal"]').forEach(function (m) {
            if (m.id !== 'custom-cert-viewer') m.style.display = 'none';
          });

          var overlay = document.createElement('div');
          overlay.id = 'custom-cert-viewer';
          overlay.style.cssText =
            'position:fixed;inset:0;background:rgba(3,7,18,0.88);backdrop-filter:blur(8px);' +
            'display:flex;align-items:center;justify-content:center;padding:1.25rem;z-index:999999;';

          overlay.innerHTML =
            '<div style="position:relative;width:100%;max-width:880px;background:linear-gradient(180deg,#111830 0%,#090d1a 100%);' +
            'border:1px solid rgba(129,140,248,0.45);border-radius:20px;padding:1.25rem 1.25rem 1.5rem;' +
            'box-shadow:0 25px 60px rgba(0,0,0,0.85);text-align:center;color:#f8fafc;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem;gap:1rem;">' +
                '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:1rem;color:#e2e8f0;text-align:left;">' +
                  titleText +
                '</span>' +
                '<button type="button" id="close-cert-viewer-btn" style="background:rgba(239,68,68,0.18);color:#fca5a5;' +
                'border:1px solid rgba(239,68,68,0.4);border-radius:10px;padding:6px 14px;cursor:pointer;' +
                'font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:0.88rem;flex-shrink:0;">Tutup ✕</button>' +
              '</div>' +
              '<div style="background:#050814;border-radius:14px;padding:0.5rem;border:1px solid rgba(148,163,184,0.18);">' +
                '<img src="' + imgSrc + '" alt="Sertifikat" style="width:100%;max-height:76vh;object-fit:contain;border-radius:10px;display:block;margin:0 auto;">' +
              '</div>' +
            '</div>';

          function closeViewer() {
            overlay.remove();
            document.body.style.overflow = '';
            document.documentElement.style.overflow = '';
          }

          overlay.addEventListener('click', function (ev) {
            if (ev.target === overlay || ev.target.id === 'close-cert-viewer-btn') closeViewer();
          });

          document.body.appendChild(overlay);
        }

       document.addEventListener('click', function (e) {
          var card = e.target.closest('.portfoliocert-card, .portfolioachievement-card, .portfolioachievements-card, [class*="cert-card"], [class*="achievement"]');
          if (!card) return;

          var img = card.querySelector('img');
          if (!img || !img.src) return;

          e.preventDefault();
          e.stopPropagation();

          var titleEl = card.querySelector('h3, h4, p');
          var title = titleEl ? titleEl.textContent.trim() : (img.alt || 'Detail Sertifikat');

          // Ganti otomatis jika terdeteksi judul piagam bawaan template
          var lowerTitle = title.toLowerCase();
          if (lowerTitle.indexOf('ips terpadu') !== -1 || lowerTitle.indexOf('juara iii') !== -1) {
            title = JUDUL_PIAGAM[0];
          } else if (lowerTitle.indexOf('pencapaian kedua') !== -1) {
            title = JUDUL_PIAGAM[1];
          } else if (card.closest('[class*="achievement"]')) {
            var allAchievements = Array.from(document.querySelectorAll('.portfolioachievement-card, .portfolioachievements-card, [class*="achievement-card"]'));
            var idx = allAchievements.indexOf(card);
            if (JUDUL_PIAGAM[idx]) {
              title = JUDUL_PIAGAM[idx];
            }
          }

          openCertViewer(img.src, title);
        }, true);
        // 5. EFEK PETIR ELEKTRIK SAAT LOADING SCREEN (52% Memuat assets...)
        (function initLoadingLightning() {
          var canvas = document.createElement('canvas');
          canvas.id = 'ariidev-lightning-loader';
          canvas.style.cssText =
            'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99998;' +
            'transition:opacity 0.55s ease;';
          document.body.appendChild(canvas);

          var ctx = canvas.getContext('2d');
          var w, h, animId;
          var bolts = [];
          var flashAlpha = 0;
          var isStopped = false;

          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          resize();
          window.addEventListener('resize', resize);

          function createBolt(startX, startY, endX, endY, displace) {
            var segments = [];
            function subdivide(x1, y1, x2, y2, disp) {
              if (disp < 6) {
                segments.push({ x1: x1, y1: y1, x2: x2, y2: y2 });
                return;
              }
              var midX = (x1 + x2) / 2 + (Math.random() - 0.5) * disp;
              var midY = (y1 + y2) / 2 + (Math.random() - 0.5) * disp;
              subdivide(x1, y1, midX, midY, disp * 0.55);
              subdivide(midX, midY, x2, y2, disp * 0.55);

              // Cabang petir kecil
              if (Math.random() < 0.28 && disp > 22) {
                var branchX = midX + (Math.random() - 0.5) * disp * 1.6;
                var branchY = midY + Math.random() * disp * 1.4;
                subdivide(midX, midY, branchX, branchY, disp * 0.45);
              }
            }
            subdivide(startX, startY, endX, endY, displace);
            return {
              segments: segments,
              alpha: 1,
              color: Math.random() > 0.35 ? '#38bdf8' : '#818cf8'
            };
          }

          function spawnStrike() {
            var cx = w * 0.5 + (Math.random() - 0.5) * Math.min(w * 0.55, 340);
            var cy = h * 0.48 + (Math.random() - 0.5) * 140;
            var startX = cx + (Math.random() - 0.5) * 260;
            bolts.push(createBolt(startX, 0, cx, cy, 130));
            flashAlpha = 0.14;
          }

          // Sambaran awal langsung muncul saat halaman dibuka
          spawnStrike();

          var lastStrike = performance.now();
          function render(now) {
            if (isStopped) return;
            ctx.clearRect(0, 0, w, h);

            // Kilatan cahaya latar halus
            if (flashAlpha > 0.005) {
              var grad = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, Math.max(w, h) * 0.65);
              grad.addColorStop(0, 'rgba(56, 189, 248, ' + flashAlpha + ')');
              grad.addColorStop(1, 'rgba(5, 5, 16, 0)');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, w, h);
              flashAlpha *= 0.86;
            }

            // Picu petir baru setiap ~320-650ms
            if (now - lastStrike > 320 + Math.random() * 330) {
              spawnStrike();
              lastStrike = now;
            }

            // Gambar setiap sambaran petir dengan efek glow neon
            for (var i = bolts.length - 1; i >= 0; i--) {
              var b = bolts[i];
              ctx.save();
              ctx.globalAlpha = b.alpha;
              ctx.shadowBlur = 18;
              ctx.shadowColor = b.color;
              ctx.strokeStyle = b.color;
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              for (var j = 0; j < b.segments.length; j++) {
                var s = b.segments[j];
                ctx.moveTo(s.x1, s.y1);
                ctx.lineTo(s.x2, s.y2);
              }
              ctx.stroke();

              // Inti putih terang di tengah petir
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 0.9;
              ctx.stroke();
              ctx.restore();

              b.alpha -= 0.065;
              if (b.alpha <= 0) bolts.splice(i, 1);
            }

            animId = requestAnimationFrame(render);
          }
          animId = requestAnimationFrame(render);

          // Pantau: begitu loading selesai & beranda muncul, pudarkan petir lalu hapus canvas
          var checkLoaded = setInterval(function () {
            var bodyText = document.body.innerText || '';
            var stillLoading = bodyText.indexOf('Memuat assets') !== -1;
            var hasHero = document.querySelector('nav, .navbar-container, .portfolioroot-section');

            if (!stillLoading && hasHero) {
              clearInterval(checkLoaded);
              canvas.style.opacity = '0';
              setTimeout(function () {
                isStopped = true;
                cancelAnimationFrame(animId);
                window.removeEventListener('resize', resize);
                canvas.remove();
              }, 600);
            }
          }, 200);
          // 7. PASTIKAN SEMUA PESAN FORM & KONTAK MASUK 100% KE AKUN KAMU (PUTUS DARI TEMPLATE LAMA)

            document.querySelectorAll('a[href*="wa.me"], a[href*="whatsapp.com"]').forEach(function (a) {
              if (NO_WA_TUJUAN && a.href.indexOf(NO_WA_TUJUAN) === -1) {
                a.href = 'https://wa.me/' + NO_WA_TUJUAN;
              }
            });
          }
          patchContactLinks();
          new MutationObserver(patchContactLinks).observe(document.documentElement, {
            childList: true,

          });

          // B. Cegat submit form "Hubungi Saya" & kirim langsung ke Gmail kamu via FormSubmit
          document.addEventListener('submit', function (e) {
            var form = e.target;
            if (!form || form.tagName !== 'FORM') return;

            e.preventDefault();
            e.stopImmediatePropagation();

            var submitBtn = form.querySelector('button[type="submit"], button');
            var originalBtnText = submitBtn ? submitBtn.textContent : 'Kirim';
            if (submitBtn) {
